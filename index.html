<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="style.css">

                </a>
                <a href="#" class="curso">
                <img src="imagens/tufos.png" alt="Extensão de cilios tufos">

                </a>
                <a href="#" class="curso">
                <img src="imagens/sobrancelha.png" alt="Designer de sobrancelha">
                <span>Designer de Sobrancelha</span>
                </a>
                <a href="#" class="curso">
                <img src="imagens/microsobran.png" alt="Micropigmentação de sobrancelha">
                <span>Micropigmentação de Sobrancelha</span>
                </a>
            </div>
            <button class="seta procima" aria-label="proximos cursos">
                &#10095
            </button>
        </div>
